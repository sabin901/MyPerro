<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyPerro</title>
    <style>
      html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        background: transparent !important;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #pet {
        display: block;
        background: transparent !important;
        outline: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        cursor: grab;
      }
      #pet:focus-visible {
        filter: drop-shadow(0 0 4px rgba(255, 218, 98, .82));
      }
      body.dragging #pet { cursor: grabbing; }
      body.peek #clock { display: none; }
      body.peek #pet { cursor: default; }
      /* Desktop text remains readable without ever painting a card or square. */
      #note {
        position: fixed; left: 50%; top: 6px; transform: translateX(-50%);
        width: max-content; max-width: calc(100% - 18px); padding: 5px 8px;
        font: 800 12px/1.35 -apple-system, "Segoe UI", system-ui, sans-serif;
        color: #fff8dc; text-align: center;
        background: transparent; border: 0; border-radius: 0; box-shadow: none;
        text-shadow:
          -1px -1px 0 rgba(50,28,16,.96), 1px -1px 0 rgba(50,28,16,.96),
          -1px 1px 0 rgba(50,28,16,.96), 1px 1px 0 rgba(50,28,16,.96),
          0 2px 3px rgba(0,0,0,.55);
        pointer-events: none;
      }
      #note::after { display: none; }
      /* Pixel Pomodoro clock beside the dog. */
      #clock {
        position: fixed; right: 6px; bottom: 6px;
        font: 13px ui-monospace, Menlo, monospace; letter-spacing: 1px;
        color: #fff8dc; background: transparent;
        padding: 2px 5px; border-radius: 0;
        text-shadow: -1px -1px 0 #2c1b13, 1px -1px 0 #2c1b13,
          -1px 1px 0 #2c1b13, 1px 1px 0 #2c1b13, 0 2px 3px rgba(0,0,0,.6);
      }
      .hidden { display: none !important; }

      /* Phase 1 diagnostics overlay — removed before alpha */
      #hud {
        position: fixed; top: 0; left: 0;
        font: 10px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #b6f8c6;
        background: rgba(0, 0, 0, 0.72);
        padding: 5px 7px;
        border-radius: 0 0 6px 0;
        white-space: pre;
        pointer-events: none;
      }
      #hud.hidden { display: none; }
      #hud.error {
        color: #fff; background: rgba(127,33,24,.94); padding: 9px 11px;
        border: 2px solid rgba(255,255,255,.72); border-radius: 8px;
      }
      #hud b { color: #fff; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="note" class="hidden"></div>
    <div id="clock" class="hidden"></div>
    <canvas id="pet" tabindex="0" role="img" aria-label="Your animated MyPerro companion" aria-keyshortcuts="F W P R N D T B J S"></canvas>
    <div id="hud" class="hidden">booting…</div>
    <script type="module" src="/pet/main.ts"></script>
  </body>
</html>

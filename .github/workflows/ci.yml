name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  # Fast lane: the pure logic. Runs on every push in seconds, no native build.
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run usage:test
      - run: npm run site:test
      - run: npm run build
      - run: npm run validate:packs
      - run: npm run character:acceptance
      - run: npm run smoke:dist
      - run: npm run performance:budget
      - run: npm run release:readiness
      - run: npm audit --audit-level=high
      - name: Install Linux native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxcb-ewmh-dev libxcb-randr0-dev libdbus-1-dev pkg-config xvfb dbus-x11
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  security:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        working-directory: src-tauri
        # Mirrors audit.toml: glib 0.18 is inherited from Tauri's GTK stack,
        # and Pawi does not call the affected VariantStrIter API.
        run: cargo audit --ignore RUSTSEC-2024-0429

  # Slow lane: prove it actually builds a native app on all three platforms.
  build:
    name: Build (${{ matrix.os }})
    needs: [test, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundle: app,dmg
            artifact: macos-apple-silicon-dmg
          - os: macos-15-intel
            bundle: app,dmg
            artifact: macos-intel-dmg
          - os: windows-latest
            bundle: nsis
            artifact: windows-nsis
          - os: ubuntu-22.04
            bundle: appimage,deb
            artifact: linux-packages
    runs-on: ${{ matrix.os }}
    env:
      # Repository variable, not a secret. Empty keeps anonymous counting inert.
      PAWI_USAGE_ENDPOINT: ${{ vars.PAWI_USAGE_ENDPOINT || vars.IPET_USAGE_ENDPOINT }}
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build deps
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxcb-ewmh-dev libxcb-randr0-dev libdbus-1-dev pkg-config xvfb dbus-x11

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Never reuse native target binaries across different runner images;
          # Ubuntu 24 build scripts cannot execute on the Ubuntu 22 package job.
          prefix-key: v1-rust-${{ matrix.os }}
          cache-targets: false

      - run: npm ci
      - name: Enforce stable publisher and physical-QA gates
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        shell: bash
        run: npm run release:readiness -- --stable --tag "$GITHUB_REF_NAME"
      - name: Disable updater artifacts for untrusted or unsigned CI builds
        if: env.HAS_UPDATER_KEY != 'true'
        shell: bash
        run: node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p));c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\\n')"
      - name: Import Windows publisher certificate
        if: matrix.os == 'windows-latest' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'pawi-publisher.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $configPath = 'src-tauri/tauri.conf.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $windows = [ordered]@{
            certificateThumbprint = $certificate.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          }
          $config.bundle | Add-Member -NotePropertyName windows -NotePropertyValue $windows -Force
          $config | ConvertTo-Json -Depth 100 | Set-Content $configPath
      - name: Build Windows or Linux package
        if: ${{ !startsWith(matrix.os, 'macos-') }}
        run: npm run release -- --bundles ${{ matrix.bundle }}
      - name: Launch packaged Windows application
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/windows-package-smoke.ps1
      - name: Launch packaged Linux application
        if: startsWith(matrix.os, 'ubuntu-')
        run: bash scripts/linux-package-smoke.sh
      - name: Verify Windows publisher signature
        if: matrix.os == 'windows-latest' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($signature.Status)" }
      - name: Build ad-hoc signed macOS package
        if: ${{ startsWith(matrix.os, 'macos-') && env.HAS_APPLE_CERTIFICATE != 'true' }}
        run: npm run release -- --bundles ${{ matrix.bundle }}
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - name: Build signed and notarized macOS package
        if: ${{ startsWith(matrix.os, 'macos-') && env.HAS_APPLE_CERTIFICATE == 'true' }}
        run: npm run release -- --bundles ${{ matrix.bundle }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Launch packaged macOS application
        if: ${{ startsWith(matrix.os, 'macos-') }}
        run: bash scripts/macos-package-smoke.sh
      - name: Generate checksums and web SBOM
        run: |
          npm run checksums
          npm run sbom
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: pawi-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 30
      - name: Upload software bill of materials
        uses: actions/upload-artifact@v7
        with:
          name: pawi-${{ matrix.artifact }}-sbom
          path: pawi-web.cdx.json
          if-no-files-found: error
          retention-days: 30

  publish-draft:
    name: Prepare draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-files
      - name: Create draft release with every platform artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/prepare-release-assets.mjs release-files release-assets "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
          (cd release-assets && sha256sum -- * > SHA256SUMS.txt)
          mapfile -d '' files < <(find release-assets -type f -print0)
          release_flags=(--draft --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" "${release_flags[@]}" \
            --title "Pawi $GITHUB_REF_NAME"

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  # Fast lane: the pure logic. Runs on every push in seconds, no native build.
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate:packs
      - run: npm run smoke:dist
      - run: npm audit --audit-level=high
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  security:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Slow lane: prove it actually builds a native app on all three platforms.
  build:
    name: Build (${{ matrix.os }})
    needs: [test, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundle: dmg
            artifact: macos-apple-silicon-dmg
          - os: macos-15-intel
            bundle: dmg
            artifact: macos-intel-dmg
          - os: windows-latest
            bundle: nsis
            artifact: windows-nsis
          - os: ubuntu-22.04
            bundle: appimage,deb
            artifact: linux-packages
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - name: Build
        run: npm run release -- --bundles ${{ matrix.bundle }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Ad-hoc signing keeps unsigned Apple Silicon test builds launchable;
          # a real Developer ID secret automatically replaces the fallback.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Generate checksums and web SBOM
        run: |
          npm run checksums
          npm run sbom
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: myperro-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 30
      - name: Upload software bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: myperro-${{ matrix.artifact }}-sbom
          path: myperro-web.cdx.json
          if-no-files-found: error
          retention-days: 30

  publish-draft:
    name: Prepare draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
      - name: Create draft release with every platform artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' files < <(find release-files -type f -print0)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft --generate-notes --title "MyPerro $GITHUB_REF_NAME"

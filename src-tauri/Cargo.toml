[package]
name = "myperro"
version = "0.9.0-rc.9"
description = "A privacy-first virtual desktop companion for Windows, macOS, and Linux"
authors = ["Sabin Raut"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = "0.5"
sysinfo = "0.32"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
log = "0.4"
active-win-pos-rs = "0.11"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
